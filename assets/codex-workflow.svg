<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1016" viewBox="0 0 680 1016" role="img" aria-labelledby="title description">
  <title id="title">Illustrative Deeperas workflow in Codex</title>
  <desc id="description">In an example app with an orders table, the user requests an export button. Deeperas asks which format to export, explaining CSV, PDF and another format. The user chooses CSV for the currently filtered orders. The format is settled; remaining details are checked next.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#60a5fa" stroke-width="2"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="1014" rx="20" fill="#0d1117" stroke="#30363d"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="45" font-size="20" letter-spacing="2" fill="#60a5fa">ILLUSTRATIVE EXAMPLE</text>
    <text x="40" y="91" font-size="32" font-weight="700" fill="#e6edf3">A clearer task for Codex</text>
    <text x="40" y="127" font-size="22" fill="#9da7b3">Example project: an app with an orders table.</text>

    <rect x="24" y="156" width="632" height="144" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="44" y="190" font-size="21" font-weight="700" letter-spacing="1" fill="#9da7b3">1 · YOUR REQUEST</text>
    <text x="44" y="234" font-size="30" fill="#e6edf3">Use Deeperas. Add an export button</text>
    <text x="44" y="274" font-size="30" fill="#e6edf3">to the orders table.</text>
    <path d="M 340 310 V 322" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="24" y="334" width="632" height="398" rx="14" fill="#10233f" stroke="#3b82f6"/>
    <text x="44" y="370" font-size="21" font-weight="700" letter-spacing="1" fill="#60a5fa">2 · DEEPERAS CLARIFIES</text>
    <text x="44" y="414" font-size="30" font-weight="700" fill="#e6edf3">What should the button export?</text>
    <text x="44" y="464" font-size="26" font-weight="700" fill="#e6edf3">A. CSV file</text>
    <text x="76" y="499" font-size="26" fill="#c6d4e7">For spreadsheets and further analysis.</text>
    <text x="44" y="544" font-size="26" font-weight="700" fill="#e6edf3">B. PDF report</text>
    <text x="76" y="579" font-size="26" fill="#c6d4e7">For sharing a report with a fixed layout.</text>
    <text x="44" y="624" font-size="26" font-weight="700" fill="#e6edf3">C. Another format</text>
    <text x="76" y="659" font-size="26" fill="#c6d4e7">Describe where you will use it.</text>
    <text x="44" y="704" font-size="20" fill="#9da7b3">One material choice, with each option explained.</text>
    <path d="M 340 742 V 754" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="24" y="766" width="632" height="170" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="44" y="804" font-size="21" font-weight="700" letter-spacing="1" fill="#9da7b3">3 · YOUR CHOICE</text>
    <text x="44" y="850" font-size="30" fill="#e6edf3">CSV, only the currently</text>
    <text x="44" y="890" font-size="30" fill="#e6edf3">filtered orders.</text>
    <text x="40" y="978" font-size="20" fill="#9da7b3">Export format settled. Remaining details are checked next.</text>
  </g>
</svg>
